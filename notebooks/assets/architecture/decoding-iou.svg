    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677c" x="24.48" y="554.11125" transform="rotate(-0 24.48 554.11125)">Toy masks explain IoU; they are not nuScenes predictions. Practical validation IoU is not a reproduced paper score.</text>
