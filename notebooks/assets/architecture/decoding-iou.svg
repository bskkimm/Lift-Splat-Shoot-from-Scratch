   </g>
   <g id="text_31">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a56a08" x="504" y="398.826563" transform="rotate(-0 504 398.826563)">Union = predicted OR target</text>
   </g>
   <g id="text_32">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #162c43" transform="translate(418.592578 439.754063)">predicted=3; target=3</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #162c43" transform="translate(419.772656 462.957188)">union = 3 + 3 − 2 = 4</text>
   </g>
   <g id="text_33">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="829.44" y="405.022812" transform="rotate(-0 829.44 405.022812)">IoU = 2 / 4 = 0.50</text>
   </g>
   <g id="text_34">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #162c43" transform="translate(726.665391 444.832187)">Sum counts across batches</text>
