   <g id="text_3">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677c" x="24.48" y="66.059062" transform="rotate(-0 24.48 66.059062)">Red arrows show derivatives; geometric cell membership is a discrete routing decision.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #52677c" x="983.52" y="554.803828" transform="rotate(-0 983.52 554.803828)">PRACTICAL LSS</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2266ae" x="115.2" y="160.416562" transform="rotate(-0 115.2 160.416562)">image encoder</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 17.921397px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7750a9" x="309.6" y="160.465186" transform="rotate(-0 309.6 160.465186)">depth × context</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="504" y="162.230625" transform="rotate(-0 504 162.230625)">voxel sum</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="698.4" y="162.230625" transform="rotate(-0 698.4 162.230625)">BEV decoder</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a56a08" x="892.8" y="162.230625" transform="rotate(-0 892.8 162.230625)">BCE loss</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #c44b5a" x="504" y="248.704531" transform="rotate(-0 504 248.704531)">gradients to weights, depth logits and context — not through floor(cell indices)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 17.238095px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a56a08" x="38.88" y="309.589174" transform="rotate(-0 38.88 309.589174)">A  /  One illustrative scalar</text>
   </g>
   <g id="text_12">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677c" x="38.88" y="329.303125" transform="rotate(-0 38.88 329.303125)">Single positive target; logit z=0</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a56a08" x="169.2" y="369.670625" transform="rotate(-0 169.2 369.670625)">L = softplus(−z)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #162c43" x="169.2" y="412.042813" transform="rotate(-0 169.2 412.042813)">g = sigmoid(0) − 1 = −0.5</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #162c43" x="169.2" y="459.61625" transform="rotate(-0 169.2 459.61625)">L before ≈ 0.6931</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c44b5a" x="349.92" y="308.806875" transform="rotate(-0 349.92 308.806875)">B  /  First Adam update</text>
   </g>
   <g id="text_17">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677c" x="349.92" y="329.346875" transform="rotate(-0 349.92 329.346875)">β₁=0.9; β₂=0.999; ε=10⁻⁸; lr=0.1</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #c44b5a" x="491.04" y="370.879687" transform="rotate(-0 491.04 370.879687)">m₁ = -0.05     v₁ = 0.00025</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #162c43" x="491.04" y="414.65625" transform="rotate(-0 491.04 414.65625)">m̂₁ = −0.5          v̂₁ = 0.25</text>
   </g>
   <g id="text_20">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #162c43" x="491.04" y="458.272969" transform="rotate(-0 491.04 458.272969)">z₁ = z₀ − lr · m̂₁ / (√v̂₁ + ε)</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f83" x="682.56" y="308.736562" transform="rotate(-0 682.56 308.736562)">C  /  Inspect the change</text>
   </g>
   <g id="text_22">
    <text style="font-size: 13.758025px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677c" x="682.56" y="329.236355" transform="rotate(-0 682.56 329.236355)">The actual notebook update follows below</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="825.84" y="374.867578" transform="rotate(-0 825.84 374.867578)">z: 0 → 0.1</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f83" x="825.84" y="419.321875" transform="rotate(-0 825.84 419.321875)">L after ≈ 0.6444</text>
   </g>
   <g id="text_25">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #162c43" x="825.84" y="457.463125" transform="rotate(-0 825.84 457.463125)">Toy learning rate differs from lr=10⁻³ below.</text>
   </g>
   <g id="text_26">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677c" x="24.48" y="554.11125" transform="rotate(-0 24.48 554.11125)">Scalar arithmetic illustrates Adam; it is not a measured learning curve or an assertion that every model step reduces loss.</text>
   </g>
